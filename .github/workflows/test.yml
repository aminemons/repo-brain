name: Repository bot checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Also run the inherited backend suite'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CODEWIKI_SKIP_FRONTEND_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --extra docs --extra dev
      - name: Check bot backend
        run: >-
          uv run ruff check backend/app/api/bots.py backend/app/api/bot_changes.py backend/app/api/repos.py
          backend/app/schemas/bots.py backend/app/schemas/bot_changes.py
          backend/app/services/bots backend/app/services/bot_changes
          backend/app/services/repo_scanner tests/backend/test_repo_registration.py
          backend/app/api/github.py backend/app/schemas/github.py backend/app/services/github
          tests/backend/test_github_discovery.py tests/e2e/server.py
          backend/app/api/ask.py backend/app/services/question_answerer.py tests/backend/test_ask_api.py tests/backend/test_question_answerer.py
          tests/backend/test_bot_local_provider.py tests/backend/test_bots_api.py tests/backend/test_bot_changes.py tests/backend/test_bot_illustration.py
      - name: Check backend types
        run: uv run mypy backend/app
      - name: Test repository chat and Git workflows
        run: uv run pytest tests/backend/test_ask_api.py tests/backend/test_question_answerer.py tests/backend/test_bot_local_provider.py tests/backend/test_bots_api.py tests/backend/test_bot_changes.py tests/backend/test_bot_illustration.py tests/backend/test_bot_retrieval.py tests/backend/test_github_discovery.py tests/backend/test_repo_registration.py tests/backend/test_repo_scanner.py renderer/tests -q
      - name: Run inherited suite when requested
        if: inputs.full_suite == true
        run: uv run pytest -q
      - name: Retrieve pinned public repository fixtures
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-repositories'
          root.mkdir()
          for fixture in json.loads(pathlib.Path('tests/acceptance/owner-repositories.json').read_text()):
              target = root / fixture['name']
              subprocess.run(['git', 'init', str(target)], check=True)
              subprocess.run(['git', '-C', str(target), 'remote', 'add', 'origin', fixture['url']], check=True)
              subprocess.run(['git', '-C', str(target), 'fetch', '--depth=1', 'origin', fixture['commit']], check=True)
              subprocess.run(['git', '-C', str(target), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Check evidence against real owner repositories
        run: uv run python scripts/check-owner-repositories.py --checkouts "$RUNNER_TEMP/owner-repositories" --report owner-repository-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: owner-repository-evidence
          path: owner-repository-results.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts and prepare private deployment
        run: |
          bash -n scripts/setup-server.sh
          bash -n scripts/server.sh
          bash scripts/setup-server.sh --prepare-only
          PUBLIC_DOMAIN=fixture.example.com docker compose --env-file deploy/server.env -f compose.server.yml -f compose.server.https.yml config --quiet
      - name: Build and start Linux containers
        run: bash scripts/server.sh up
      - name: Verify authentication, storage, network access and real Najm rendering
        run: bash scripts/server.sh check
      - name: Collect render fixture
        if: success()
        run: docker compose --env-file deploy/server.env -f compose.server.yml exec -T app python -c "import sys; sys.stdout.buffer.write(open('/tmp/najm-smoke.png', 'rb').read())" > najm-smoke.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: najm-linux-render
          path: najm-smoke.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare real browser checks
        run: |
          npm --prefix frontend ci
          frontend/node_modules/.bin/playwright install --with-deps chromium
          docker compose --env-file deploy/server.env -f compose.server.yml -f compose.e2e.yml up --detach --force-recreate --wait --wait-timeout 120 app
      - name: Test the complete bot journey in Chromium
        run: |
          export OWNER_TOKEN="$(sed -n 's/^CODEWIKI_AUTH_TOKEN=//p' deploy/server.env)"
          export NODE_PATH="$PWD/frontend/node_modules"
          frontend/node_modules/.bin/playwright test tests/e2e/server.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-journey-results
          path: test-results/
          if-no-files-found: ignore
      - name: Container diagnostics
        if: failure()
        run: |
          bash scripts/server.sh status
          bash scripts/server.sh logs
      - name: Stop containers
        if: always()
        run: docker compose --env-file deploy/server.env -f compose.server.yml down
