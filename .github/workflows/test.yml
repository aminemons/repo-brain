name: Repository bot checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Also run the inherited backend suite'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CODEWIKI_SKIP_FRONTEND_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --extra docs --extra dev
      - name: Check bot backend
        run: >-
          uv run ruff check backend/app/api/bots.py backend/app/api/bot_changes.py
          backend/app/schemas/bots.py backend/app/schemas/bot_changes.py
          backend/app/services/bots backend/app/services/bot_changes
          tests/backend/test_bots_api.py tests/backend/test_bot_changes.py
      - name: Check backend types
        run: uv run mypy backend/app
      - name: Test repository chat and Git workflows
        run: uv run pytest tests/backend/test_bots_api.py tests/backend/test_bot_changes.py -q
      - name: Run inherited suite when requested
        if: inputs.full_suite == true
        run: uv run pytest -q
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
